name: "Docker"

on:
  workflow_dispatch:

  push:

permissions:
  contents: read

jobs:
  build:
    name: "Build (${{ matrix.item }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        item: ["web", "migrator", "hosting"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # clones the metatool-app release pinned by METAMCP_VERSION in VERSION
      - name: Download MetaMCP
        run: make download

      - name: Build image
        run: make build DOCKER_VARIANT=${{ matrix.item }}

      - name: Test image
        run: make test DOCKER_VARIANT=${{ matrix.item }}

      - name: Login to DockerHub
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        if: github.ref == 'refs/heads/master'
        run: make push DOCKER_VARIANT=${{ matrix.item }}

  release:
    name: "Release"
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./VERSION
          gh release view "$VERSION" || gh release create "$VERSION" --generate-notes

  docs:
    name: "Docs"
    needs: build
    if: github.ref == 'refs/heads/master'
    uses: dockette/.github/.github/workflows/dockerhub-description.yml@master
    secrets: inherit
    with:
      image: "dockette/metamcp"
