services:
  web:
    image: ${DOCKER_WEB_IMAGE}
    platform: ${DOCKER_PLATFORM}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 12005:3000
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: ${DATABASE_URL}
      USE_DOCKER_HOST: ${USE_DOCKER_HOST}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  hosting:
    image: ${DOCKER_HOSTING_IMAGE}
    platform: ${DOCKER_PLATFORM}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 12007:12007
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: ${DATABASE_URL}
      USE_DOCKER_HOST: ${USE_DOCKER_HOST}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres:
    image: postgres:16.2-alpine3.18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - 5432:5432
    volumes:
      - .docker/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  migrator:
    image: ${DOCKER_MIGRATOR_IMAGE}
    platform: ${DOCKER_PLATFORM}
    command: pnpm drizzle-kit migrate
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy

  mcp:
    image: ghcr.io/sooperset/mcp-atlassian:latest
    profiles: [mcp]
    restart: unless-stopped
    command: --transport sse --port 9000 -vv
    ports:
      - 20001:9000
    environment:
      CONFLUENCE_URL: ${MCP_ATLASSIAN_CONFLUENCE_URL}
      CONFLUENCE_USERNAME: ${MCP_ATLASSIAN_CONFLUENCE_USERNAME}
      CONFLUENCE_API_TOKEN: ${MCP_ATLASSIAN_CONFLUENCE_API_TOKEN}
      JIRA_URL: ${MCP_ATLASSIAN_JIRA_URL}
      JIRA_USERNAME: ${MCP_ATLASSIAN_JIRA_USERNAME}
      JIRA_API_TOKEN: ${MCP_ATLASSIAN_JIRA_API_TOKEN}
      READ_ONLY_MODE: ${MCP_ATLASSIAN_READ_ONLY_MODE:-true}
